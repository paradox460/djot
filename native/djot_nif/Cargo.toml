[package]
name = "djot_nif"
version = "0.1.5"
authors = ["Jeff Sandberg"]
license = "MIT"
description = "Rust NIF for Djot, a Djot-to-HTML renderer"
repository = "https://github.com/paradox460/djot"
edition = "2024"
rust-version = "1.91"

[lib]
name = "djot_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
jotdown = "0.10.0"
rustler = "0.39.0"
ammonia = "4.2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }